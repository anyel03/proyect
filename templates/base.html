<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web con Bootstrap</title>
  
  <!-- CSS de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Iconos de Bootstrap (Opcional) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Tus estilos personalizados (Opcional) -->
  <style>
    /* Estilos adicionales si deseas personalizar algo */
    .hero-section {
      background-color: #f8f9fa;
      padding: 80px 0;
    }
  </style>
</head>
<body>

  <!-- 1. BARRA DE NAVEGACIÓN (NAVBAR) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">MiLogo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/crearTareas/">crear tareas</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

    {%block content%}
    {%endblock content%}  
 


  <!-- 4. PIE DE PÁGINA (FOOTER) -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center text-md-start">
      <div class="row align-items-center">
        <div class="col-md-7 mb-3 mb-md-0">
          <p class="mb-0">&copy; 2026 MiEmpresa. Todos los derechos reservados.</p>
        </div>
        <div class="col-md-5 text-center text-md-end">
          <a href="#" class="text-white me-3"><i class="bi bi-facebook fs-5"></i></a>
          <a href="#" class="text-white me-3"><i class="bi bi-twitter-x fs-5"></i></a>
          <a href="#" class="text-white me-3"><i class="bi bi-instagram fs-5"></i></a>
          <a href="#" class="text-white"><i class="bi bi-linkedin fs-5"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <!-- JavaScript de Bootstrap 5 (Incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
